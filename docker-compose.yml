services:
  app:
    build: .
    container_name: ptmanager-app
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://ptmanager:${MYSQL_PASSWORD:?set in .env}@mysql:3306/ptmanager
      REDIS_URL: redis://redis:6379
      BACKEND_PORT: "4000"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set in .env}
      RUN_SEED: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@pt-manager.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set in .env}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: ptmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_USER: ptmanager
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_DATABASE: ptmanager
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ptmanager-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  mysqldata:
  redisdata:
